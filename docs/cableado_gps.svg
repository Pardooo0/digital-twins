<!-- ===================== RASPBERRY PI 3 (conector GPIO) ===================== -->
<rect x="60" y="700" width="470" height="200" rx="14" fill="#0b6e3a"/>
<rect x="88" y="720" width="404" height="80" rx="6" fill="#1b1b1b"/>
<text x="80" y="835" font-size="13" fill="#fff">◄ pin 1: extremo lejos de los USB</text>
<text x="510" y="835" font-size="13" fill="#fff" text-anchor="end">hacia los USB (21–40) ►</text>
<text x="80" y="865" font-size="15" font-weight="bold" fill="#fff">Raspberry Pi 3 · GPIO visto desde arriba</text>
<text x="80" y="887" font-size="12" fill="#cfe8d9">Fila de arriba = orilla de la placa (pines pares)</text>

<!-- ===================== CABLES ===================== -->
<g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<path d="M150 740 V628 H820 V570" stroke="#d62828"/>
<path d="M190 740 V650 H860 V570" stroke="#222222"/>
<path d="M270 740 V676 H1390 V105 H1120 V160" stroke="#2a9d8f"/>
</g>
<circle cx="820" cy="570" r="6" fill="#d62828"/>
<circle cx="860" cy="570" r="6" fill="#222222" stroke="#fff" stroke-width="1.5"/>
<circle cx="1120" cy="160" r="6" fill="#2a9d8f"/>
<text x="300" y="622" font-size="14" font-weight="bold" fill="#d62828">pin 4 (5V) → 5V del shield</text>
<text x="300" y="644" font-size="14" font-weight="bold" fill="#222222">pin 6 (GND) → GND del shield</text>
<text x="300" y="670" font-size="14" font-weight="bold" fill="#2a9d8f">pin 10 (RXD, GPIO15) ← TX del GPS (sale por el pin 2)</text>
<rect x="1000" y="664" width="300" height="24" rx="12" fill="#fff" stroke="#2a9d8f" stroke-width="2"/>
<text x="1150" y="681" font-size="13" font-weight="bold" fill="#2a9d8f" text-anchor="middle">Mide el pin 2: 3.3 V → directo · 5 V → divisor</text>

<!-- Pines del GPIO 1–20 (fila de arriba: pares; fila de abajo: impares) -->
<g font-size="12" font-weight="bold" text-anchor="middle">
<circle cx="110" cy="740" r="14" fill="#d9d9d9"/><text x="110" y="744" fill="#333">2</text>
