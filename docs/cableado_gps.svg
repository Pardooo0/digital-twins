<rect x="945" y="257" width="10" height="10"/><rect x="979" y="257" width="10" height="10"/><rect x="1013" y="257" width="10" height="10"/><rect x="1047" y="257" width="10" height="10"/>
<rect x="1081" y="257" width="10" height="10"/><rect x="1115" y="257" width="10" height="10"/><rect x="1149" y="257" width="10" height="10"/><rect x="1183" y="257" width="10" height="10"/>
<rect x="945" y="287" width="10" height="10"/><rect x="979" y="287" width="10" height="10"/><rect x="1013" y="287" width="10" height="10"/><rect x="1047" y="287" width="10" height="10"/>
<rect x="1081" y="287" width="10" height="10"/><rect x="1115" y="287" width="10" height="10"/><rect x="1149" y="287" width="10" height="10"/><rect x="1183" y="287" width="10" height="10"/>
</g>
<text x="923" y="236" font-size="13" font-weight="bold" fill="#7ee0d3" text-anchor="end">TX</text>
<text x="923" y="266" font-size="13" fill="#c8d6ea" text-anchor="end">DIGITAL</text>
<text x="923" y="296" font-size="13" font-weight="bold" fill="#9cc2ff" text-anchor="end">RX</text>
<!-- Jumpers de fábrica (verificado): TX del GPS → 2, RX del GPS → 3 -->
<rect x="1110" y="222" width="20" height="50" rx="3" fill="#f4c430" stroke="#8a6d00" stroke-width="2"/>
<rect x="1076" y="252" width="20" height="50" rx="3" fill="#f4c430" stroke="#8a6d00" stroke-width="2"/>
<text x="933" y="340" font-size="14" fill="#fff">Jumper TX–DIGITAL en el 2 → el GPS habla</text>
<text x="933" y="361" font-size="14" fill="#fff">por el pin 2 del conector de arriba.</text>
<text x="933" y="382" font-size="13" fill="#c8d6ea">Jumper RX–DIGITAL en el 3: escucha, no se usa.</text>

<!-- Antena, módulo, LEDs, microSD -->
<circle cx="600" cy="230" r="17" fill="#d4af37" stroke="#8a6d00" stroke-width="2"/>
<circle cx="600" cy="230" r="6" fill="#8a6d00"/>
<text x="625" y="235" font-size="13" fill="#fff">Antena (SMA)</text>
<rect x="600" y="280" width="170" height="110" rx="6" fill="#f2f2f2" stroke="#999"/>
<text x="685" y="320" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">u-blox</text>
<text x="685" y="344" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">NEO-6M</text>
<text x="685" y="368" font-size="12" fill="#555" text-anchor="middle">lógica de 3.3 V</text>
<text x="600" y="430" font-size="20" font-weight="bold" fill="#fff">GPS Shield Duinopeak</text>
<text x="600" y="452" font-size="13" fill="#c8d6ea">vista superior</text>
<circle cx="820" cy="470" r="13" fill="#39d353" opacity="0.35"/>
<circle cx="820" cy="470" r="8" fill="#39d353"/>
<text x="840" y="475" font-size="14" fill="#fff"><tspan font-weight="bold">PWR</tspan> encendido = recibe 5 V</text>
<circle cx="820" cy="505" r="8" fill="none" stroke="#9be7a8" stroke-width="2.5"/>
<text x="840" y="510" font-size="14" fill="#fff"><tspan font-weight="bold">TP</tspan> parpadea 1 vez/s = tiene fix</text>
<rect x="1170" y="390" width="120" height="90" rx="6" fill="#8d99a6"/>
<text x="1230" y="432" font-size="12" fill="#fff" text-anchor="middle">microSD</text>
<text x="1230" y="450" font-size="12" fill="#fff" text-anchor="middle">(no se usa)</text>

<!-- Conector de alimentación (abajo) y analógico -->
<rect x="678" y="555" width="284" height="30" rx="3" fill="#111"/>
<g fill="#444">
<rect x="694" y="564" width="12" height="12"/><rect x="734" y="564" width="12" height="12"/><rect x="774" y="564" width="12" height="12"/>
