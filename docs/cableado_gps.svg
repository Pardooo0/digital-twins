<circle cx="350" cy="780" r="14" fill="#7d8b99"/><text x="350" y="784" fill="#fff">13</text>
<circle cx="390" cy="780" r="14" fill="#7d8b99"/><text x="390" y="784" fill="#fff">15</text>
<circle cx="430" cy="780" r="14" fill="#d9d9d9"/><text x="430" y="784" fill="#333">17</text>
<circle cx="470" cy="780" r="14" fill="#d9d9d9"/><text x="470" y="784" fill="#333">19</text>
</g>
<text x="60" y="928" font-size="13" fill="#555">Gris oscuro = ya ocupado: 1 DHT22 +, 5 botón S, 7 DHT22 datos, 9 botón −,</text>
<text x="60" y="948" font-size="13" fill="#555">11/13/15 LED R/G/B, 14 LED −, 20 DHT22 −.</text>
<text x="60" y="968" font-size="13" fill="#555">Pin 8 (punteado, TXD → RX del GPS): opcional, déjalo libre.</text>

<!-- ===================== DIVISOR ===================== -->
<rect x="580" y="710" width="400" height="270" rx="12" fill="#f4f8fb" stroke="#c9d6e2"/>
<text x="600" y="740" font-size="18" font-weight="bold" fill="#14344d">Divisor (solo si el pin 2 mide 5 V)</text>
<text x="600" y="764" font-size="13" fill="#555">El NEO-6M trabaja a 3.3 V: casi seguro va directo.</text>
<text x="600" y="782" font-size="13" fill="#555">Con divisor, 3.3 V bajarían a 2.2 V (lectura dudosa).</text>
<text x="600" y="835" font-size="14" font-weight="bold" fill="#2a9d8f">TX (2)</text>
<line x1="662" y1="830" x2="700" y2="830" stroke="#333" stroke-width="3"/>
<rect x="700" y="818" width="70" height="24" fill="#fff" stroke="#333" stroke-width="3"/>
<text x="735" y="835" font-size="13" font-weight="bold" text-anchor="middle">1 kΩ</text>
<line x1="770" y1="830" x2="860" y2="830" stroke="#333" stroke-width="3"/>
<circle cx="820" cy="830" r="5" fill="#333"/>
<text x="866" y="826" font-size="14" font-weight="bold" fill="#2a9d8f">Pin 10</text>
<text x="866" y="844" font-size="12" fill="#555">GPIO15 RXD</text>
<line x1="820" y1="830" x2="820" y2="862" stroke="#333" stroke-width="3"/>
<rect x="808" y="862" width="24" height="60" fill="#fff" stroke="#333" stroke-width="3"/>
<text x="842" y="897" font-size="13" font-weight="bold">2 kΩ</text>
<line x1="820" y1="922" x2="820" y2="940" stroke="#333" stroke-width="3"/>
<line x1="802" y1="940" x2="838" y2="940" stroke="#333" stroke-width="3"/>
<line x1="808" y1="947" x2="832" y2="947" stroke="#333" stroke-width="3"/>
<line x1="814" y1="954" x2="826" y2="954" stroke="#333" stroke-width="3"/>
<text x="842" y="952" font-size="13" fill="#333">GND (pin 6 o 9)</text>
<text x="600" y="964" font-size="13" fill="#333">5 V × 2k / (1k + 2k) ≈ 3.3 V</text>

<!-- ===================== PASOS ===================== -->
<rect x="1000" y="710" width="460" height="270" rx="12" fill="#fff8ef" stroke="#f0d9b5"/>
<text x="1020" y="740" font-size="18" font-weight="bold" fill="#14344d">Cómo dejarlo funcionando</text>
<g font-size="14" fill="#333">
<text x="1020" y="770">1. No muevas los jumpers: el que une DIGITAL con</text>
<text x="1038" y="790">TX marca por dónde habla el GPS (el pin 2).</text>
<text x="1020" y="816">2. Cable del pin 10 → pin 2 del conector de arriba</text>
<text x="1038" y="836">(no en el bloque de jumpers).</text>
<text x="1020" y="862">3. 5V → pin 4 y GND → pin 6 (conector de abajo).</text>
<text x="1020" y="888">4. Con el GPS encendido, mide el pin 2 contra GND.</text>
<text x="1020" y="914">5. En la Pi: <tspan font-family="Consolas, monospace" font-weight="bold">timeout 6 cat /dev/serial0</tspan></text>
<text x="1038" y="934">Deben salir líneas $GPGGA y $GPRMC.</text>
<text x="1020" y="960">6. Pin 8 → RX del GPS: no hace falta, déjalo libre.</text>
</g>
</svg>
