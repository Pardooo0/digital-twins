<rect x="1148" y="154" width="12" height="12"/><rect x="1182" y="154" width="12" height="12"/>
</g>
<g font-size="12" fill="#fff" text-anchor="middle">
<text x="950" y="196">7</text><text x="984" y="196">~6</text><text x="1018" y="196">~5</text><text x="1052" y="196">4</text>
<text x="1086" y="196">~3</text>
<text x="1120" y="196" fill="#7ee0d3" font-weight="bold" font-size="14">2</text><text x="1154" y="196" font-size="10">TX→1</text><text x="1190" y="196" font-size="10">RX←0</text>
</g>
<circle cx="1120" cy="160" r="13" fill="none" stroke="#2a9d8f" stroke-width="4"/>

<!-- Bloque de jumpers: fila TX del GPS / fila D7–D0 / fila RX del GPS -->
<rect x="933" y="212" width="272" height="100" rx="6" fill="#163a6b"/>
<g fill="#d4af37">
<rect x="945" y="227" width="10" height="10"/><rect x="979" y="227" width="10" height="10"/><rect x="1013" y="227" width="10" height="10"/><rect x="1047" y="227" width="10" height="10"/>
