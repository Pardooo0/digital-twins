<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" font-family="Arial, Helvetica, sans-serif">
<rect width="1480" height="1010" fill="#ffffff"/>
<text x="40" y="52" font-size="30" font-weight="bold" fill="#14344d">Cableado del GPS · Shield Duinopeak (NEO-6M) → Raspberry Pi 3</text>
<text x="40" y="82" font-size="16" fill="#555">Solo 3 cables: 5V, GND y la señal TX del GPS, que en este shield sale por el pin 2 (jumpers de fábrica). Verificado el 2026-11-23.</text>

<!-- ===================== SHIELD (vista superior) ===================== -->
<rect x="560" y="130" width="760" height="470" rx="18" fill="#1f4f8f"/>

<!-- Conector digital (arriba), rotulado como en el shield -->
<rect x="583" y="145" width="340" height="30" rx="3" fill="#111"/>
<g fill="#444">
<rect x="594" y="154" width="12" height="12"/><rect x="628" y="154" width="12" height="12"/><rect x="662" y="154" width="12" height="12"/>
