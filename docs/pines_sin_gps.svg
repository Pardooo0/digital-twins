<text x="156" y="445" font-size="15" font-weight="bold" fill="#f77f00" transform="rotate(50 156 445)">DHT22 +  (3.3V)</text>
<line x1="206" y1="311" x2="206" y2="281" stroke="#c05050" stroke-width="2"/>
<text x="212" y="271" font-size="12" font-weight="normal" fill="#c05050" transform="rotate(-50 212 271)">GPS 5V · después</text>
<line x1="262" y1="405" x2="262" y2="435" stroke="#8338ec" stroke-width="2"/>
<text x="268" y="445" font-size="15" font-weight="bold" fill="#8338ec" transform="rotate(50 268 445)">Botón S  (GPIO3)</text>
<line x1="262" y1="311" x2="262" y2="281" stroke="#c05050" stroke-width="2"/>
<text x="268" y="271" font-size="12" font-weight="normal" fill="#c05050" transform="rotate(-50 268 271)">GPS GND · después</text>
<line x1="318" y1="405" x2="318" y2="435" stroke="#9a7a00" stroke-width="2"/>
<text x="324" y="445" font-size="15" font-weight="bold" fill="#9a7a00" transform="rotate(50 324 445)">DHT22 out  (GPIO4)</text>
<line x1="318" y1="311" x2="318" y2="281" stroke="#c05050" stroke-width="2"/>
<text x="324" y="271" font-size="12" font-weight="normal" fill="#c05050" transform="rotate(-50 324 271)">GPS RX · después</text>
<line x1="374" y1="405" x2="374" y2="435" stroke="#222222" stroke-width="2"/>
<text x="380" y="445" font-size="15" font-weight="bold" fill="#222222" transform="rotate(50 380 445)">Botón −  (GND)</text>
<line x1="374" y1="311" x2="374" y2="281" stroke="#c05050" stroke-width="2"/>
<text x="380" y="271" font-size="12" font-weight="normal" fill="#c05050" transform="rotate(-50 380 271)">GPS TX · después</text>
<line x1="430" y1="405" x2="430" y2="435" stroke="#d62828" stroke-width="2"/>
<text x="436" y="445" font-size="15" font-weight="bold" fill="#d62828" transform="rotate(50 436 445)">LED R  (GPIO17)</text>
<line x1="486" y1="405" x2="486" y2="435" stroke="#2a9d3f" stroke-width="2"/>
<text x="492" y="445" font-size="15" font-weight="bold" fill="#2a9d3f" transform="rotate(50 492 445)">LED G  (GPIO27)</text>
<line x1="486" y1="311" x2="486" y2="281" stroke="#222222" stroke-width="2"/>
<text x="492" y="271" font-size="15" font-weight="bold" fill="#222222" transform="rotate(-50 492 271)">LED −  (GND)</text>
<line x1="542" y1="405" x2="542" y2="435" stroke="#1f5fd1" stroke-width="2"/>
<text x="548" y="445" font-size="15" font-weight="bold" fill="#1f5fd1" transform="rotate(50 548 445)">LED B  (GPIO22)</text>
<line x1="654" y1="311" x2="654" y2="281" stroke="#222222" stroke-width="2"/>
<text x="660" y="271" font-size="15" font-weight="bold" fill="#222222" transform="rotate(-50 660 271)">DHT22 −  (GND)</text>
<text x="130" y="125" font-size="15" font-weight="bold" fill="#d62828">⚠ Pines 2 y 4 = 5 V: no conectar nada ahí ahora</text>
<text x="100" y="635" font-size="13" font-weight="bold" fill="#b86000">Pin 1 = el cuadrado, del lado de la microSD. Fila de arriba (borde de la placa) = pares; fila de abajo (hacia el centro) = impares.</text>
<rect x="30" y="680" width="420" height="216" rx="12" fill="#f6f8fa" stroke="#b86000" stroke-width="3"/>
<text x="50" y="714" font-size="20" font-weight="bold" fill="#b86000">1 · DHT22 (3 pines)</text>
<text x="50" y="738" font-size="13" fill="#777">Pin del módulo</text>
<text x="260" y="738" font-size="13" fill="#777">Pin de la Pi</text>
<circle cx="60" cy="763" r="9" fill="#f77f00"/>
<text x="78" y="768" font-size="17" font-weight="bold" fill="#111">+ (VCC)</text>
<text x="225" y="768" font-size="17" fill="#111">→</text>
<text x="260" y="768" font-size="17" font-weight="bold" fill="#111">pin 1 · 3.3 V</text>
<circle cx="60" cy="797" r="9" fill="#e0b000"/>
<text x="78" y="802" font-size="17" font-weight="bold" fill="#111">out (DATA)</text>
<text x="225" y="802" font-size="17" fill="#111">→</text>
<text x="260" y="802" font-size="17" font-weight="bold" fill="#111">pin 7 · GPIO4</text>
<circle cx="60" cy="831" r="9" fill="#222"/>
<text x="78" y="836" font-size="17" font-weight="bold" fill="#111">− (GND)</text>
<text x="225" y="836" font-size="17" fill="#111">→</text>
<text x="260" y="836" font-size="17" font-weight="bold" fill="#111">pin 20 · GND</text>
<text x="50" y="870" font-size="13" fill="#444">Va a 3.3 V, NO a 5 V.</text>
<text x="50" y="892" font-size="13" fill="#444">Revisa lo impreso: el orden cambia según el módulo.</text>
<rect x="510" y="680" width="420" height="228" rx="12" fill="#f6f8fa" stroke="#d62828" stroke-width="3"/>
<text x="530" y="714" font-size="20" font-weight="bold" fill="#d62828">2 · LED RGB KY-016</text>
<text x="530" y="738" font-size="13" fill="#777">Pin del módulo</text>
<text x="740" y="738" font-size="13" fill="#777">Pin de la Pi</text>
<circle cx="540" cy="763" r="9" fill="#d62828"/>
<text x="558" y="768" font-size="17" font-weight="bold" fill="#111">R</text>
<text x="705" y="768" font-size="17" fill="#111">→</text>
<text x="740" y="768" font-size="17" font-weight="bold" fill="#111">pin 11 · GPIO17</text>
<circle cx="540" cy="797" r="9" fill="#2a9d3f"/>
<text x="558" y="802" font-size="17" font-weight="bold" fill="#111">G</text>
<text x="705" y="802" font-size="17" fill="#111">→</text>
<text x="740" y="802" font-size="17" font-weight="bold" fill="#111">pin 13 · GPIO27</text>
<circle cx="540" cy="831" r="9" fill="#1f5fd1"/>
<text x="558" y="836" font-size="17" font-weight="bold" fill="#111">B</text>
<text x="705" y="836" font-size="17" fill="#111">→</text>
<text x="740" y="836" font-size="17" font-weight="bold" fill="#111">pin 15 · GPIO22</text>
<circle cx="540" cy="865" r="9" fill="#222"/>
<text x="558" y="870" font-size="17" font-weight="bold" fill="#111">−</text>
<text x="705" y="870" font-size="17" fill="#111">→</text>
<text x="740" y="870" font-size="17" font-weight="bold" fill="#111">pin 14 · GND</text>
<text x="530" y="904" font-size="13" fill="#444">Sin resistencias en la placa: 220 Ω en R, G y B.</text>
<rect x="990" y="680" width="420" height="194" rx="12" fill="#f6f8fa" stroke="#8338ec" stroke-width="3"/>
<text x="1010" y="714" font-size="20" font-weight="bold" fill="#8338ec">3 · Botón KY-004</text>
<text x="1010" y="738" font-size="13" fill="#777">Pin del módulo</text>
<text x="1220" y="738" font-size="13" fill="#777">Pin de la Pi</text>
<circle cx="1020" cy="763" r="9" fill="#8338ec"/>
<text x="1038" y="768" font-size="17" font-weight="bold" fill="#111">S</text>
<text x="1185" y="768" font-size="17" fill="#111">→</text>
<text x="1220" y="768" font-size="17" font-weight="bold" fill="#111">pin 5 · GPIO3</text>
<circle cx="1020" cy="797" r="9" fill="#222"/>
<text x="1038" y="802" font-size="17" font-weight="bold" fill="#111">−</text>
<text x="1185" y="802" font-size="17" fill="#111">→</text>
<text x="1220" y="802" font-size="17" font-weight="bold" fill="#111">pin 9 · GND</text>
<circle cx="1020" cy="831" r="9" fill="#bbb"/>
<text x="1038" y="836" font-size="17" font-weight="bold" fill="#111">+ (medio)</text>
<text x="1185" y="836" font-size="17" fill="#111">→</text>
<text x="1220" y="836" font-size="17" font-weight="bold" fill="#111">sin conectar</text>
<text x="1010" y="870" font-size="13" fill="#444">Presionar = apagar; presionar de nuevo = encender.</text>
<text x="40" y="970" font-size="14" fill="#555">Cablea siempre con la Pi apagada y sin energía. El GPS (pines 4, 6, 8 y 10) se conecta después, cuando se mida su TX con multímetro.</text>
</svg>