<text x="474" y="939" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
<line x1="532" y1="934" x2="556" y2="934" stroke="#222222" stroke-width="4"/>
<text x="562" y="939" font-size="14" font-weight="bold" fill="#222222">GND</text>
<rect x="418" y="951" width="112" height="26" rx="6" fill="#fff" stroke="#8338ec" stroke-width="2.5"/>
<text x="474" y="969" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">SDA</text>
<line x1="532" y1="964" x2="556" y2="964" stroke="#8338ec" stroke-width="4"/>
<text x="562" y="969" font-size="14" font-weight="bold" fill="#8338ec">GPIO1</text>
<rect x="418" y="981" width="112" height="26" rx="6" fill="#fff" stroke="#8338ec" stroke-width="2.5"/>
<text x="474" y="999" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">SCL</text>
<line x1="532" y1="994" x2="556" y2="994" stroke="#8338ec" stroke-width="4"/>
<text x="562" y="999" font-size="14" font-weight="bold" fill="#8338ec">GPIO0</text>
<rect x="418" y="1011" width="112" height="26" rx="6" fill="#fff" stroke="#9a9a9a" stroke-width="2.5"/>
<text x="474" y="1029" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">32K · SQW</text>
<line x1="532" y1="1024" x2="556" y2="1024" stroke="#9a9a9a" stroke-width="4"/>
<text x="562" y="1029" font-size="14" font-weight="bold" fill="#9a9a9a">sin conectar</text>
<text x="418" y="1070" font-size="13" fill="#555">Tira de 6: GND · VCC · SDA · SCL · SQW · 32K</text>
<text x="418" y="1099" font-size="13" fill="#555">¡A 3.3 V, no a 5 V! (carga la pila)</text>
<rect x="760" y="835" width="340" height="280" rx="12" fill="#f7f7f7" stroke="#d0d0d0"/>
<rect x="760" y="835" width="340" height="8" rx="4" fill="#c9a000"/>
<text x="778" y="873" font-size="18" font-weight="bold" fill="#14344d">③ DHT22</text>
<rect x="778" y="891" width="112" height="26" rx="6" fill="#fff" stroke="#222222" stroke-width="2.5"/>
<text x="834" y="909" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
<line x1="892" y1="904" x2="916" y2="904" stroke="#222222" stroke-width="4"/>
<text x="922" y="909" font-size="14" font-weight="bold" fill="#222222">GND</text>
<rect x="778" y="921" width="112" height="26" rx="6" fill="#fff" stroke="#f77f00" stroke-width="2.5"/>
<text x="834" y="939" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">VCC</text>
<line x1="892" y1="934" x2="916" y2="934" stroke="#f77f00" stroke-width="4"/>
<text x="922" y="939" font-size="14" font-weight="bold" fill="#f77f00">3.3 V</text>
<rect x="778" y="951" width="112" height="26" rx="6" fill="#fff" stroke="#c9a000" stroke-width="2.5"/>
<text x="834" y="969" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">DAT</text>
<line x1="892" y1="964" x2="916" y2="964" stroke="#c9a000" stroke-width="4"/>
<text x="922" y="969" font-size="14" font-weight="bold" fill="#c9a000">GPIO3</text>
<text x="778" y="1010" font-size="13" fill="#555">Orden en el módulo rojo (izq. → der.):</text>
<text x="778" y="1028" font-size="13" font-weight="bold" fill="#c0392b">GND · VCC · DAT</text>
<text x="778" y="1046" font-size="13" fill="#555">(no es + · OUT · −: guíate por la serigrafía)</text>
<text x="778" y="1099" font-size="13" fill="#555">El módulo ya trae resistencia pull-up.</text>
<rect x="1120" y="835" width="340" height="280" rx="12" fill="#f7f7f7" stroke="#d0d0d0"/>
<rect x="1120" y="835" width="340" height="8" rx="4" fill="#2a9d8f"/>
<text x="1138" y="873" font-size="18" font-weight="bold" fill="#14344d">④ Shield GPS (NEO-6M)</text>
