<circle cx="870" cy="364" r="15" fill="#f77f00" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="368" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3.3</text>
<text x="848" y="369" font-size="12" fill="#ddd" text-anchor="end">3V3</text>
<line x1="885" y1="364" x2="940" y2="364" stroke="#f77f00" stroke-width="4"/>
<rect x="940" y="350" width="264.0" height="28" rx="14" fill="#f77f00"/>
<text x="1072.0" y="369" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3.3 V → VCC de RTC y DHT22</text>
<circle cx="630" cy="416" r="15" fill="#d9d9d9" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="420" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">8</text>
<text x="652" y="421" font-size="12" fill="#ddd">GPIO8</text>
<text x="575" y="421" font-size="13" fill="#888" text-anchor="end">LED azul de la placa (no conectar)</text>
<circle cx="870" cy="416" r="15" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="420" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="848" y="421" font-size="12" fill="#ddd" text-anchor="end">GPIO4</text>
<line x1="885" y1="416" x2="940" y2="416" stroke="#1d4ed8" stroke-width="4"/>
<rect x="940" y="402" width="124.6" height="28" rx="14" fill="#1d4ed8"/>
<text x="1002.3" y="421" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">microSD · SCK</text>
<circle cx="630" cy="468" r="15" fill="#d9d9d9" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="472" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<text x="652" y="473" font-size="12" fill="#ddd">GPIO9</text>
<text x="575" y="473" font-size="13" fill="#888" text-anchor="end">Botón BOOT de la placa (no conectar)</text>
<circle cx="870" cy="468" r="15" fill="#c9a000" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="472" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="848" y="473" font-size="12" fill="#ddd" text-anchor="end">GPIO3</text>
<line x1="885" y1="468" x2="940" y2="468" stroke="#c9a000" stroke-width="4"/>
<rect x="940" y="454" width="165.6" height="28" rx="14" fill="#c9a000"/>
<text x="1022.8" y="473" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">DHT22 · DAT</text>
<circle cx="630" cy="520" r="15" fill="#d9d9d9" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="524" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">10</text>
<text x="652" y="525" font-size="12" fill="#ddd">GPIO10</text>
<text x="575" y="525" font-size="13" fill="#888" text-anchor="end">libre</text>
<circle cx="870" cy="520" r="15" fill="#d9d9d9" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="524" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<text x="848" y="525" font-size="12" fill="#ddd" text-anchor="end">GPIO2</text>
<text x="925" y="525" font-size="13" fill="#888">no usar (pin de arranque)</text>
<circle cx="630" cy="572" r="15" fill="#2a9d8f" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="576" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">20</text>
<text x="652" y="577" font-size="12" fill="#ddd">GPIO20 RX</text>
<line x1="560" y1="572" x2="615" y2="572" stroke="#2a9d8f" stroke-width="4"/>
<rect x="320.6" y="558" width="239.39999999999998" height="28" rx="14" fill="#2a9d8f"/>
<text x="440.3" y="577" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">GPS · TX (pin 2 del shield)</text>
<circle cx="870" cy="572" r="15" fill="#8338ec" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="576" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="848" y="577" font-size="12" fill="#ddd" text-anchor="end">GPIO1</text>
<line x1="885" y1="572" x2="940" y2="572" stroke="#8338ec" stroke-width="4"/>
<rect x="940" y="558" width="91.8" height="28" rx="14" fill="#8338ec"/>
<text x="985.9" y="577" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">RTC · SDA</text>
<circle cx="630" cy="624" r="15" fill="#d9d9d9" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="628" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">21</text>
<text x="652" y="629" font-size="12" fill="#ddd">GPIO21 TX</text>
<text x="575" y="629" font-size="13" fill="#888" text-anchor="end">GPS · RX (no conectar)</text>
<circle cx="870" cy="624" r="15" fill="#8338ec" stroke="#fff" stroke-width="1.5"/>
<text x="870" y="628" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
<text x="848" y="629" font-size="12" fill="#ddd" text-anchor="end">GPIO0</text>
<line x1="885" y1="624" x2="940" y2="624" stroke="#8338ec" stroke-width="4"/>
<rect x="940" y="610" width="91.8" height="28" rx="14" fill="#8338ec"/>
<text x="985.9" y="629" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">RTC · SCL</text>
<circle cx="700" cy="416" r="6" fill="#4ea8ff"/>
<text x="700" y="440" font-size="10" fill="#9cc2ff" text-anchor="middle">LED</text>
<rect x="40" y="690" width="700" height="125" rx="12" fill="#f4f8fb" stroke="#c9d6e2"/>
<text x="60" y="720" font-size="18" font-weight="bold" fill="#14344d">Placa de expansión: cada GPIO tiene una tira S · VCC · GND</text>
<text x="60" y="748" font-size="14" fill="#333">Amarillo = señal (GPIO) · <tspan fill="#f77f00" font-weight="bold">rojo = VCC, 3.3 V de fábrica (mídelo)</tspan> · negro = GND</text>
<text x="60" y="771" font-size="14" fill="#333">RTC y DHT22: VCC y GND de la tira roja/negra de su pin, o del pin 3.3 de la placa.</text>
<text x="60" y="794" font-size="14" fill="#d62828" font-weight="bold">microSD y GPS: VCC al pin 5V, NUNCA a una tira roja (3.3 V no les basta).</text>
<rect x="760" y="690" width="700" height="125" rx="12" fill="#fff8ef" stroke="#f0d9b5"/>
<text x="780" y="720" font-size="18" font-weight="bold" fill="#14344d">Antes de conectar</text>
<text x="780" y="748" font-size="14" fill="#333">Cablea siempre con el USB desconectado.</text>
<text x="780" y="771" font-size="14" fill="#333">Etapa M2: un módulo a la vez, en el orden ① → ④, y probar cada uno.</text>
<text x="780" y="794" font-size="14" fill="#333">Ningún módulo externo en los pines 2, 8 y 9 (pines de arranque).</text>
<rect x="40" y="835" width="340" height="280" rx="12" fill="#f7f7f7" stroke="#d0d0d0"/>
<rect x="40" y="835" width="340" height="8" rx="4" fill="#1d4ed8"/>
<text x="58" y="873" font-size="18" font-weight="bold" fill="#14344d">① Adaptador microSD</text>
<rect x="58" y="891" width="112" height="26" rx="6" fill="#fff" stroke="#d62828" stroke-width="2.5"/>
<text x="114" y="909" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">VCC</text>
<line x1="172" y1="904" x2="196" y2="904" stroke="#d62828" stroke-width="4"/>
<text x="202" y="909" font-size="14" font-weight="bold" fill="#d62828">pin 5V de la placa</text>
<rect x="58" y="921" width="112" height="26" rx="6" fill="#fff" stroke="#222222" stroke-width="2.5"/>
<text x="114" y="939" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
