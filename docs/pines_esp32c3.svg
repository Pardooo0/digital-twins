<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" font-family="Arial, Helvetica, sans-serif">
<rect width="1500" height="1130" fill="#ffffff"/>
<text x="40" y="52" font-size="30" font-weight="bold" fill="#14344d">Mapa de pines · Caja negra con ESP32-C3 Super Mini</text>
<text x="40" y="82" font-size="16" fill="#555">Vista superior, USB-C arriba. Sobre la placa de expansión (tiras S · VCC · GND). Sensores: shield GPS (pin 2), DHT22, RTC DS3231 y microSD.</text>
<rect x="600" y="140" width="300" height="520" rx="18" fill="#1b1b1b"/>
