<text x="114" y="969" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">SCK</text>
<line x1="172" y1="964" x2="196" y2="964" stroke="#1d4ed8" stroke-width="4"/>
<text x="202" y="969" font-size="14" font-weight="bold" fill="#1d4ed8">GPIO4</text>
<rect x="58" y="981" width="112" height="26" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="114" y="999" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">MISO</text>
<line x1="172" y1="994" x2="196" y2="994" stroke="#1d4ed8" stroke-width="4"/>
<text x="202" y="999" font-size="14" font-weight="bold" fill="#1d4ed8">GPIO5</text>
<rect x="58" y="1011" width="112" height="26" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="114" y="1029" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">MOSI</text>
<line x1="172" y1="1024" x2="196" y2="1024" stroke="#1d4ed8" stroke-width="4"/>
<text x="202" y="1029" font-size="14" font-weight="bold" fill="#1d4ed8">GPIO6</text>
<rect x="58" y="1041" width="112" height="26" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="114" y="1059" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">CS</text>
<line x1="172" y1="1054" x2="196" y2="1054" stroke="#1d4ed8" stroke-width="4"/>
<text x="202" y="1059" font-size="14" font-weight="bold" fill="#1d4ed8">GPIO7</text>
<text x="58" y="1086" font-size="13" fill="#555">Orden: GND · VCC · MISO · MOSI · SCK · CS</text>
<text x="58" y="1104" font-size="13" fill="#555">VCC a 5 V: su regulador (AMS1117) baja a 3.3 V.</text>
<rect x="400" y="835" width="340" height="280" rx="12" fill="#f7f7f7" stroke="#d0d0d0"/>
<rect x="400" y="835" width="340" height="8" rx="4" fill="#8338ec"/>
<text x="418" y="873" font-size="18" font-weight="bold" fill="#14344d">② RTC DS3231 (ZS-042)</text>
