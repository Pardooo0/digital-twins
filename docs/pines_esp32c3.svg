<text x="1047.4" y="317" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">GND → todos los GND</text>
<circle cx="630" cy="364" r="15" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>
<text x="630" y="368" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
<text x="652" y="369" font-size="12" fill="#ddd">GPIO7</text>
<line x1="560" y1="364" x2="615" y2="364" stroke="#1d4ed8" stroke-width="4"/>
