<text x="1194" y="909" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">5V</text>
<line x1="1252" y1="904" x2="1276" y2="904" stroke="#d62828" stroke-width="4"/>
<text x="1282" y="909" font-size="14" font-weight="bold" fill="#d62828">pin 5V de la placa</text>
<rect x="1138" y="921" width="112" height="26" rx="6" fill="#fff" stroke="#222222" stroke-width="2.5"/>
<text x="1194" y="939" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
<line x1="1252" y1="934" x2="1276" y2="934" stroke="#222222" stroke-width="4"/>
<text x="1282" y="939" font-size="14" font-weight="bold" fill="#222222">GND</text>
<rect x="1138" y="951" width="112" height="26" rx="6" fill="#fff" stroke="#2a9d8f" stroke-width="2.5"/>
<text x="1194" y="969" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">pin 2 (TX)</text>
<line x1="1252" y1="964" x2="1276" y2="964" stroke="#2a9d8f" stroke-width="4"/>
<text x="1282" y="969" font-size="14" font-weight="bold" fill="#2a9d8f">GPIO20</text>
<rect x="1138" y="981" width="112" height="26" rx="6" fill="#fff" stroke="#9a9a9a" stroke-width="2.5"/>
<text x="1194" y="999" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">pin 3 (RX)</text>
<line x1="1252" y1="994" x2="1276" y2="994" stroke="#9a9a9a" stroke-width="4"/>
<text x="1282" y="999" font-size="14" font-weight="bold" fill="#9a9a9a">sin conectar</text>
<text x="1138" y="1099" font-size="13" fill="#555">Jumpers del shield sin cambios.</text>
</svg>